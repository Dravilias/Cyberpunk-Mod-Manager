<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Mod Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="gamePicker">Choose game folder</button>
    <span id="gamePathLabel"></span>
    <br>
    <button id="filePicker">Choose mod archive (.zip, .7z, .rar)</button>
    <div id="installProgress" hidden>
        <div id="installLabel"></div>
        <div class="progressTrack"><div id="installBar"></div></div>
    </div>
    <div id="installErrors"></div>
    <div id="updatePanel">
        <input id="nexusApiKey" type="password" placeholder="Nexus API key">
        <button id="saveApiKey">Save key</button>
        <button id="checkUpdates">Check for updates</button>
    </div>
    <div id="updateStatus"></div>
    <input id="modSearch" type="search" placeholder="Search installed mods...">
    <ul id="modList"></ul>
    <div id="emptyMessage" hidden></div>
    <script>
        const gamePicker = document.getElementById("gamePicker");
        const gamePathLabel = document.getElementById("gamePathLabel");
        const filePicker = document.getElementById("filePicker");
        const modList = document.getElementById("modList");
        const modSearch = document.getElementById("modSearch");
        const emptyMessage = document.getElementById("emptyMessage");
        const installProgress = document.getElementById("installProgress");
        const installLabel = document.getElementById("installLabel");
        const installBar = document.getElementById("installBar");
        const installErrors = document.getElementById("installErrors");
        const nexusApiKey = document.getElementById("nexusApiKey");
        const saveApiKey = document.getElementById("saveApiKey");
        const checkUpdates = document.getElementById("checkUpdates");
        const updateStatus = document.getElementById("updateStatus");

        async function renderGamePath() {
            const p = await window.api.getGamePath();
            gamePathLabel.textContent = p ? p : "not set";
            filePicker.disabled = !p;
        }
        renderGamePath();

        gamePicker.addEventListener("click", async () => {
            await window.api.selectGamePath();
            renderGamePath();
        });

        let installedMods = [];
        let modUpdates = {};

        window.api.getNexusApiKey().then(key => {
            nexusApiKey.value = key;
        });

        saveApiKey.addEventListener("click", async () => {
            await window.api.setNexusApiKey(nexusApiKey.value);
            updateStatus.textContent = nexusApiKey.value.trim() ? "API key saved." : "API key cleared.";
        });

        checkUpdates.addEventListener("click", async () => {
            checkUpdates.disabled = true;
            updateStatus.textContent = "Checking Nexus for updates...";
            const result = await window.api.checkModUpdates();
            checkUpdates.disabled = false;

            if (result.error) {
                updateStatus.textContent = result.error;
                return;
            }
            modUpdates = result.updates;
            const count = Object.keys(modUpdates).length;
            const untracked = installedMods.length - result.checked;
            let message = count === 0
                ? `All ${result.checked} tracked mods are up to date.`
                : `${count} of ${result.checked} tracked mods have updates.`;
            if (untracked > 0) {
                message += ` ${untracked} mods aren't tracked (installed before update checks, or not a Nexus download).`;
            }
            updateStatus.textContent = message;
            filterModList();
        });

        async function renderModList() {
            installedMods = await window.api.getInstalledMods();
            filterModList();
        }

        function filterModList() {
            const query = modSearch.value.trim().toLowerCase();
            const matches = installedMods.filter(record => record.name.toLowerCase().includes(query));

            modList.innerHTML = "";
            matches.forEach(record => {
                const enabled = record.enabled !== false;
                const li = document.createElement("li")
                li.classList.toggle("disabled", !enabled);

                const name = document.createElement("span");
                name.className = "modName";
                name.textContent = record.name;
                if (record.nexus) {
                    const version = document.createElement("span");
                    version.className = "modVersion";
                    version.textContent = "v" + record.nexus.version;
                    name.appendChild(version);
                }
                const update = modUpdates[record.name];
                if (update) {
                    const badge = document.createElement("button");
                    badge.className = "updateBadge";
                    badge.textContent = update.version ? `Update: v${update.version}` : "Update available";
                    badge.title = "Open the mod's files page on Nexus";
                    badge.addEventListener("click", () => window.api.openModPage(record.name));
                    name.appendChild(badge);
                }
                li.appendChild(name);

                const actions = document.createElement("div");
                actions.className = "modActions";

                const toggleButton = document.createElement("button");
                toggleButton.className = "toggleButton";
                toggleButton.textContent = enabled ? "Disable" : "Enable";
                toggleButton.addEventListener("click", () => {
                    window.api.setModEnabled(record.name, !enabled).then(() => {
                        renderModList()
                    })
                })
                actions.appendChild(toggleButton);

                const button = document.createElement("button");
                button.className = "deleteButton";
                button.textContent = "Delete";
                button.addEventListener("click", () => {
                    console.log("button clicked for", record.name);
                    window.api.deleteMod(record.name).then(() => {
                        renderModList()
                    })
                })
                actions.appendChild(button);

                li.appendChild(actions);
                modList.appendChild(li)
            });

            if (installedMods.length === 0) {
                emptyMessage.textContent = "No mods installed yet.";
            } else if (matches.length === 0) {
                emptyMessage.textContent = `No mods match "${modSearch.value.trim()}".`;
            }
            emptyMessage.hidden = matches.length > 0;
        }

        modSearch.addEventListener("input", filterModList);
        renderModList()

        let currentModLabel = "";
        window.api.onInstallProgress(({ done, total, percent, extracting }) => {
            installBar.classList.toggle("extracting", !!extracting);
            if (extracting) {
                installBar.style.width = "100%";
                installLabel.textContent = `${currentModLabel} — extracting...`;
                return;
            }
            installBar.style.width = percent + "%";
            installLabel.textContent = `${currentModLabel} — ${done}/${total} files (${percent}%)`;
        });

        filePicker.addEventListener("click", async () => {
            const paths = await window.api.selectModZip();
            if (!paths) return;

            filePicker.disabled = true;
            gamePicker.disabled = true;
            installProgress.hidden = false;
            installErrors.replaceChildren();

            try {
                for (let i = 0; i < paths.length; i++) {
                    const name = paths[i].split(/[\\/]/).pop();
                    currentModLabel = `Installing ${name} (${i + 1}/${paths.length})`;
                    installLabel.textContent = currentModLabel;
                    installBar.classList.remove("extracting");
                    installBar.style.width = "0%";
                    try {
                        await window.api.installModFromPath(paths[i]);
                        console.log("installed " + paths[i]);
                    } catch (error) {
                        // Electron prefixes the message with "Error invoking remote method ...: Error: ".
                        const message = error.message.replace(/^.*?Error: /, "");
                        const line = document.createElement("div");
                        line.textContent = `Couldn't install ${name}: ${message}`;
                        installErrors.appendChild(line);
                    }
                }
            } finally {
                installProgress.hidden = true;
                gamePicker.disabled = false;
                renderGamePath();
                renderModList();
            }
        });
    </script>
</body>
</html>
